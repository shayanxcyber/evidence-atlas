[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-atlas"
version = "0.1.0"
description = "An inspectable document workbench with versioned sources, retrieval and evaluation."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1", "httpx2>=2,<3"]

[project.scripts]
atlas = "atlas.__main__:main"

[tool.setuptools.package-data]
atlas = ["demo/*.md", "demo/*.json"]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

