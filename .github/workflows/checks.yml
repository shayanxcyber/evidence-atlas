name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check atlas tests
      - run: python -m ruff format --check atlas tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
  film:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            videos/evidence-atlas-film/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: videos/evidence-atlas-film
      - run: npm run lint
        working-directory: videos/evidence-atlas-film
      - run: npm run build
        working-directory: videos/evidence-atlas-film
